services:
  - type: web
    name: fieldnotes-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: STORAGE_BACKEND
        value: supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: research-documents
      - key: CORS_ORIGINS
        value: https://grace-pasion.github.io
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENALEX_API_KEY
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: OPENAI_EMBEDDING_MODEL
        value: text-embedding-3-small
      - key: MAX_UPLOAD_MB
        value: "25"
