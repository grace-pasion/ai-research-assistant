name: Deploy frontend to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_API_URL: ${{ vars.VITE_API_URL || 'https://fieldnotes-api-l1bc.onrender.com' }}
    outputs:
      deploy: ${{ steps.backend.outputs.deploy }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Check backend configuration
        id: backend
        run: |
          if [ -z "$VITE_API_URL" ]; then
            echo "::warning::Set the VITE_API_URL Actions variable to your deployed HTTPS API URL to enable deployment."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure GitHub Pages
        if: steps.backend.outputs.deploy == 'true'
        uses: actions/configure-pages@v5

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Test frontend
        working-directory: frontend
        env:
          VITE_API_URL: http://localhost:8000
        run: npm test

      - name: Build frontend
        working-directory: frontend
        env:
          REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: npm run build -- --base="/${REPOSITORY_NAME}/"

      - name: Upload Pages artifact
        if: steps.backend.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    if: needs.build.outputs.deploy == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
